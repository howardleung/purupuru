packages:
  - apps/*
  - packages/*
overrides:
  # Next 15 pins a vulnerable PostCSS; patch this transitive CSS parser only.
  'next>postcss': 8.5.28
  # Remove when @prisma/config ships deepmerge-ts >=8 (GHSA-ggr8-5vv4-36mx).
  '@prisma/config>deepmerge-ts': 8.0.1
allowBuilds:
  '@clerk/shared': false
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
